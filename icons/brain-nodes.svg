<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" aria-hidden="true">
  <!-- Laid over icons/brain.png on the AI Prompt tab (same 128 x 128 grid): a tiny glowing node runs along one of
       the brain's folds, then the next, then the next. The four paths are the centrelines of the image's own fold
       lines, traced from its pixels, so each node stays on a nerve. Nothing is drawn while a node is resting. -->
  <defs>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#ff9ec0" stop-opacity=".65"/>
      <stop offset="1" stop-color="#ff6f9c" stop-opacity="0"/>
    </radialGradient>
    <style>@media (prefers-reduced-motion: reduce) { .node { display: none; } }</style>
  </defs>

  <!-- the long winding fold through the middle -->
  <g class="node" opacity="0">
    <circle r="6.5" fill="url(#halo)"/><circle r="2.6" fill="#fff"/>
    <animateMotion dur="6.4s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.4;1"
      path="M33.5 71.5 L36.5 71.5 L39.5 72.5 L42.5 73.5 L45.5 70.5 L48.5 68.5 L51.5 65.5 L54.5 62.5 L57.5 60.5 L59.5 57.5 L60.5 54.5 L63.5 51.5 L66.5 48.5 L64.5 45.5 L61.5 46.5 L58.5 47.5 L55.5 49.5 L52.5 52.5 L50.5 55.5 L47.5 56.5 L44.5 57.5 L41.5 58.5 L38.5 59.5 L35.5 61.5 L32.5 64.5 L31.5 67.5 L28.5 70.5 L25.5 73.5 L24.5 76.5 L23.5 79.5 L23.5 82.5 L26.5 85.5 L29.5 88.5 L32.5 89.5 L35.5 89.5 L38.5 89.5 L41.5 89.5 L44.5 87.5 L46.5 84.5 L49.5 81.5 L52.5 78.5 L55.5 75.5 L58.5 75.5 L61.5 74.5 L64.5 71.5 L66.5 68.5 L69.5 66.5 L72.5 66.5 L75.5 65.5 L78.5 65.5 L81.5 65.5 L84.5 66.5 L87.5 67.5 L90.5 67.5 L93.5 67.5 L96.5 67.5 L99.5 65.5 L100.5 63.5"/>
    <animate attributeName="opacity" dur="6.4s" repeatCount="indefinite" calcMode="linear" values="0;1;1;0;0" keyTimes="0;0.02;0.38;0.4;1"/>
  </g>

  <!-- the upper front fold -->
  <g class="node" opacity="0">
    <circle r="6.5" fill="url(#halo)"/><circle r="2.6" fill="#fff"/>
    <animateMotion dur="6.4s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.42;0.58;1"
      path="M62.5 24.5 L61.5 27.5 L61.5 30.5 L61.5 33.5 L61.5 36.5 L58.5 36.5 L55.5 33.5 L52.5 32.5 L49.5 35.5 L47.5 38.5 L44.5 39.5 L41.5 38.5 L39.5 41.5 L38.5 43.5 L35.5 42.5 L32.5 42.5 L29.5 44.5 L26.5 47.5 L26.5 50.5 L25.5 53.5 L22.5 55.5 L20.5 55.5"/>
    <animate attributeName="opacity" dur="6.4s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.42;0.44;0.56;0.58;1"/>
  </g>

  <!-- the lower (temporal) fold -->
  <g class="node" opacity="0">
    <circle r="6.5" fill="url(#halo)"/><circle r="2.6" fill="#fff"/>
    <animateMotion dur="6.4s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6;0.71;1"
      path="M109.5 96.5 L107.5 93.5 L105.5 90.5 L102.5 87.5 L99.5 86.5 L96.5 86.5 L93.5 84.5 L90.5 85.5 L87.5 85.5 L84.5 85.5 L81.5 85.5 L78.5 85.5 L75.5 85.5 L72.5 86.5"/>
    <animate attributeName="opacity" dur="6.4s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.6;0.62;0.69;0.71;1"/>
  </g>

  <!-- the back fold -->
  <g class="node" opacity="0">
    <circle r="6.5" fill="url(#halo)"/><circle r="2.6" fill="#fff"/>
    <animateMotion dur="6.4s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.73;0.83;1"
      path="M85.5 60.5 L88.5 59.5 L91.5 59.5 L93.5 56.5 L95.5 53.5 L98.5 51.5 L101.5 53.5 L104.5 56.5 L107.5 58.5 L110.5 58.5 L113.5 60.5 L115.5 63.5 L115.5 64.5"/>
    <animate attributeName="opacity" dur="6.4s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.73;0.75;0.81;0.83;1"/>
  </g>
</svg>
