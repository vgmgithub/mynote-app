<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1726" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MyNotes" />
  <title>MyNotes — Private Offline Personal Finance Tracker</title>

  <!-- ===== SEO: description, Open Graph, Twitter Card, structured data ==========================
       Environment-agnostic on purpose - the SAME tags render on staging, local and production, so what
       changes between environments (a search engine must never index staging or local) is confined to
       ONE line: the robots meta just below, defaulted to noindex here and only relaxed for production by
       seo.js. Every other tag here is inert on a non-production copy - present, but never seen by anyone
       real since search engines never reach it. See docs/seo.md. -->
  <meta name="description" content="MyNotes is a private, offline personal finance app: track expenses, investments, savings and financial goals without SMS scanning or bank access. Any 5 features free, forever." />
  <meta name="keywords" content="personal finance app, expense tracker, budget app, investment tracker, offline finance app, private finance app, savings tracker, India finance app" />
  <meta name="author" content="MyNotes" />
  <!-- Kept OUT of search results until this exact host is production - see seo.js. -->
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://mynotes.viewsofvgm.com/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="MyNotes" />
  <meta property="og:title" content="MyNotes — Private Offline Personal Finance Tracker" />
  <meta property="og:description" content="Track expenses, investments, savings and financial goals — no SMS scanning, no bank access, no ads. Any 5 features free, forever." />
  <meta property="og:url" content="https://mynotes.viewsofvgm.com/" />
  <meta property="og:image" content="https://mynotes.viewsofvgm.com/icons/icon-512.png" />
  <meta property="og:locale" content="en_IN" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="MyNotes — Private Offline Personal Finance Tracker" />
  <meta name="twitter:description" content="Track expenses, investments, savings and financial goals — no SMS scanning, no bank access, no ads. Any 5 features free, forever." />
  <meta name="twitter:image" content="https://mynotes.viewsofvgm.com/icons/icon-512.png" />

  <!-- What MyNotes IS, for search engines and any AI assistant reading the page on someone's behalf -
       facts only, matching the Free Plan exactly (lib/validate.js FREE_FEATURE_LIMIT = 5), never a claim
       the app itself doesn't make. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "MyNotes",
    "url": "https://mynotes.viewsofvgm.com/",
    "description": "A private, offline personal finance app to track expenses, investments, savings and financial goals. No SMS scanning, no bank access, no ads. Records stay on the device.",
    "applicationCategory": "FinanceApplication",
    "operatingSystem": "Android, iOS, Windows, macOS",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR", "description": "Any 5 features, free forever" }
  }
  </script>
  <!-- ===== end SEO ============================================================================= -->

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="env-icons.js"></script>
  <script type="module" src="seo.js"></script>
  <script>
    // The browser offers "install this app" once per page load (beforeinstallprompt, Chrome / Edge / Android).
    // It is caught here, before any module runs: app.js used to listen only after an await in init(), and an
    // offer that fired first was lost, so the website's button said "How to install" in a browser that could
    // have installed in one tap. app.js reads window.__installOffer.
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installOffer = e; });
    window.addEventListener('appinstalled', function () { window.__installOffer = null; });
  </script>
  <script>
    // Visit ?reset=1 to wipe the service worker + caches and reload cleanly.
    // Useful when a previous SW is serving stale code despite hard reloads.
    if (location.search.indexOf('reset=1') !== -1 && 'serviceWorker' in navigator) {
      (async () => {
        try {
          for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
          for (const k of await caches.keys()) await caches.delete(k);
        } catch (_) {}
        location.replace(location.pathname);
      })();
    }
  </script>
</head>
<body>
  <header class="app-header">
    <div class="title-row">
      <button id="backBtn" class="icon-btn hidden" aria-label="Back to home">&#8249;</button>
      <div class="title-center">
        <h1 id="appTitle">MyNote&nbsp;Stocks</h1>
      </div>
      <button id="proBtn" class="pro-badge-btn hidden" aria-label="What Pro adds to this feature" title="What Pro adds"><img src="icons/emoji/pro-star.png" alt="" width="20" height="20"></button>
      <button id="menuBtn" class="icon-btn" aria-label="Menu">&#8942;</button>
      <div id="homeHeadRight" class="home-head-right hidden"></div>
    </div>
    <nav class="portfolio-tabs" id="portfolioTabs"></nav>
  </header>

  <main id="main">
    <section id="homeView" class="home-view hidden"></section>
    <section id="investmentView" class="home-view hidden"></section>
    <section id="savingsView" class="home-view hidden"></section>
    <section id="expenseView" class="home-view hidden"></section>
    <section id="pfView" class="home-view hidden"></section>
    <section id="healthView" class="home-view hidden"></section>
    <section id="vaultView" class="home-view hidden"></section>
    <section id="mfView" class="mf-view hidden"></section>
    <section id="fdView" class="mf-view hidden"></section>
    <section id="divView" class="mf-view hidden"></section>
    <section id="metalView" class="mf-view hidden"></section>
    <section id="bondView" class="mf-view hidden"></section>
    <section id="efView" class="mf-view hidden"></section>
    <section id="ccView" class="mf-view hidden"></section>
    <section id="bankSavView" class="mf-view hidden"></section>
    <section id="calcView" class="mf-view hidden"></section>
    <section id="analysisView" class="mf-view hidden"></section>

    <section class="summary hidden" id="summary"></section>
    <div class="price-status-section hidden" id="price-status"></div>

    <div class="toolbar hidden" id="toolbar">
      <div class="seg" id="filterSeg"></div>
      <div class="sortbar" id="sortBar">
        <button class="sort-btn" type="button" data-field="name">Name</button>
        <button class="sort-btn" type="button" data-field="pct">Return %</button>
        <button class="sort-btn" type="button" data-field="value">Value</button>
      </div>
      <input id="search" class="search" type="search" placeholder="Search stock or category" />
    </div>

    <section id="stockList" class="stock-list hidden"></section>
    <section id="monthlyView" class="trend-view hidden"></section>
    <section id="heatmapView" class="hidden"></section>
    <section id="trendView" class="trend-view hidden"></section>
    <section id="feedView" class="hidden"></section>
  </main>

  <button id="ocrBtn" class="fab fab-secondary hidden" aria-label="Update prices from screenshot" title="Update prices from a broker screenshot">📷</button>
  <button id="mfFetchBtn" class="fab fab-secondary hidden" aria-label="Fetch latest NAV online" title="Fetch latest NAV for all funds (AMFI)">☁️</button>
  <button id="addBtn" class="fab hidden" aria-label="Add stock">+</button>
  <button id="mfAddBtn" class="fab hidden" aria-label="Add mutual fund">+</button>
  <button id="fdAddBtn" class="fab hidden" aria-label="Add fixed deposit">+</button>
  <button id="metalAddBtn" class="fab hidden" aria-label="Add metal transaction">+</button>
  <button id="bondAddBtn" class="fab hidden" aria-label="Add bond">+</button>
  <button id="efAddBtn" class="fab hidden" aria-label="Add emergency fund entry">+</button>
  <button id="bankSavAddBtn" class="fab hidden" aria-label="Add bank savings account">+</button>
  <button id="ccAddBtn" class="fab hidden" aria-label="Add credit card">+</button>
  <button id="pfAddBtn" class="fab fab-personal hidden" aria-label="Add personal spend" title="Add personal spend"><img src="icons/personal-finance.png" alt="" /></button>
  <button id="vaultAddBtn" class="fab fab-vault hidden" aria-label="Add a password" title="Add a password">+</button>
  <button id="backupFab" class="fab fab-backup hidden" aria-label="Back up now" title="Back up now"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v6m-3-3 3 3 3-3"/></svg></button>
  <button id="spendAddBtn" class="fab fab-spend hidden" aria-label="Add spend" title="Add spend"><span class="fab-emoji" aria-hidden="true">🛒</span></button>
  <button id="healthAddBtn" class="fab fab-health hidden" aria-label="Add health check" title="Add health check"><img src="icons/health-fab.png" alt="" /></button>

  <nav class="bottom-nav" id="bottomNav"></nav>
  <nav class="bottom-nav hidden" id="mfBottomNav"></nav>
  <nav class="bottom-nav hidden" id="fdBottomNav"></nav>
  <nav class="bottom-nav hidden" id="divBottomNav"></nav>
  <nav class="bottom-nav hidden" id="metalBottomNav"></nav>
  <nav class="bottom-nav hidden" id="bondBottomNav"></nav>
  <nav class="bottom-nav hidden" id="efBottomNav"></nav>
  <nav class="bottom-nav hidden" id="ccBottomNav"></nav>
  <nav class="bottom-nav hidden" id="expBottomNav"></nav>
  <nav class="bottom-nav hidden" id="pfBottomNav"></nav>
  <nav class="bottom-nav home-nav hidden" id="homeNav"></nav>
  <nav class="bottom-nav hidden" id="healthBottomNav"></nav>
  <nav class="bottom-nav hidden" id="calcBottomNav"></nav>
  <nav class="bottom-nav hidden" id="analysisBottomNav"></nav>

  <div id="modalHost" class="modal-host hidden" aria-hidden="true"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
