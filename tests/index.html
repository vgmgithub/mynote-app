<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyNotes tests</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; background: #0e1726; color: #e8eefc; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    #summary { font-weight: 700; margin: 8px 0 12px; }
    .ok { color: #34d399; } .bad { color: #f87171; }
    li { margin: 2px 0; } pre { white-space: pre-wrap; color: #f87171; margin: 2px 0 6px 18px; }
    iframe { width: 390px; height: 700px; border: 1px solid #28365e; border-radius: 10px; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>MyNotes integration tests</h1>
  <p>Runs the real app in the frame below against a separate test database. Your own data is never touched.</p>
  <div id="summary">Running...</div>
  <ul id="list"></ul>
  <iframe id="app" title="app under test"></iframe>
  <script type="module" src="./browser.js"></script>
</body>
</html>
